<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}
body{margin:0;width:500px;height:500px;background:#f2eee4;color:#14110d;position:relative;
  font-family:-apple-system,"PingFang SC",sans-serif;
  background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.02) 0 1px,transparent 1px 3px)}
.serif{font-family:"Songti SC","Source Han Serif SC",Georgia,serif;font-weight:600}
.seal{position:absolute;left:40px;top:40px;width:40px;height:40px;background:#b23a25;color:#fff;display:grid;place-items:center;font-size:20px;transform:rotate(-4deg);border-radius:2px}
.eyebrow{position:absolute;left:92px;top:48px;font-size:11px;letter-spacing:.22em;color:#8a8177;font-family:"SF Mono",Menlo,monospace}
h1{position:absolute;left:40px;top:150px;margin:0;font-size:104px;line-height:1.05;letter-spacing:-.03em}
.small{position:absolute;left:44px;top:290px;font-size:17px;color:#5c554c;letter-spacing:.04em}
.line{position:absolute;left:40px;bottom:96px;right:40px;height:1px;background:#d5ccba}
.foot{position:absolute;left:40px;bottom:52px;font-size:11px;letter-spacing:.16em;color:#8a8177;font-family:"SF Mono",Menlo,monospace}
</style></head><body>
<div class="seal serif">协</div>
<div class="eyebrow">ADVENTURERS GUILD</div>
<h1 class="serif">协议</h1>
<div class="small">不是调度</div>
<div class="line"></div>
<div class="foot">跨设备 · 跨区域</div>
</body></html>
