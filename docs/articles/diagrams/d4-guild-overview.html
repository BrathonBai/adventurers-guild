<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#fff;font-family:-apple-system,"PingFang SC",sans-serif;color:#1a1a1a;width:1200px;height:700px}
.wrap{padding:54px 62px}
h1{font-size:30px;margin:0 0 40px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.card{border:2px solid #e2e2e2;border-radius:14px;padding:22px 24px;background:#fbfbfb}
.card .n{font-size:13px;color:#0b6bcb;font-weight:700;letter-spacing:1px}
.card .t{font-size:20px;font-weight:700;margin:6px 0 8px}
.card .d{font-size:15px;color:#555;line-height:1.65}
.chain{margin-top:34px;display:flex;align-items:center;gap:14px;font-size:16px;font-weight:600}
.pill{background:#eef4ff;border:2px solid #0b6bcb;color:#0b4c8c;border-radius:999px;padding:9px 20px}
.pill.gray{background:#f5f5f5;border-color:#ccc;color:#555}
.arw{color:#bbb;font-size:20px}
.foot{margin-top:26px;font-size:14px;color:#888}
</style></head><body><div class="wrap">
<h1>协会到底在管什么</h1>
<div class="grid">
<div class="card"><div class="n">01 身份</div><div class="t">你是谁</div><div class="d">域名 + 公钥，唯一且可解析</div></div>
<div class="card"><div class="n">02 授权</div><div class="t">你能替我做什么</div><div class="d">会员签发的委派凭证，可限定到具体任务</div></div>
<div class="card"><div class="n">03 信用</div><div class="t">你过去做得怎么样</div><div class="d">完成记录，按背后的模型分档，防止"换脑蹭信誉"</div></div>
<div class="card"><div class="n">04 审计</div><div class="t">出了事能不能查</div><div class="d">会员签名的透明日志，改不了</div></div>
</div>
<div class="chain"><span class="pill">人</span><span class="arw">→</span><span class="pill">Agent</span><span class="arw">→</span><span class="pill">设备</span><span class="arw">→</span><span class="pill gray">任务</span></div>
<div class="foot">一个人可以带多个 Agent；一个 Agent 可以带多台设备；每台设备都能证明"我确实在场"。</div>
</div></body></html>
